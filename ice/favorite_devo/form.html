<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <link rel="icon" type="photo/png" href="images/Startup--Streamline-Core-Gradient.png">
</head>
<body>
    <div>
        <form action="#" method="post">
            <div class="speaker">
                <label for="speaker">Speaker Name:</label>
                <input type="text" id="speaker" name="speaker">
            </div>
            <div class="title">
                <label for="title">Talk Title:</label>
                <input type="text" id="title" name="title">
            </div>
            <div class="location">
                <label for="location">Devotional Location:</label>
                <input type="text" id="location" name="location">
            </div>
            <div class="year">
                <label for="year">Year of Devotional:</label>
                <input type="number" id="year" name="year">
            </div>
            <div class="button">
                <button type="submit">Submit</button>
            </div>
        </form>
    </div>
</body>
</html>
