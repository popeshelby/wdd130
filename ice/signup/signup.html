<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>
    <link rel="icon" type="image/png" href="images/Strawberry--Streamline-Core-Gradient.png">

    <style>
        * {
            margin: 0;
            box-sizing: border-box;
        }

        body {
            background: rgb(120, 96, 64);
            min-height: 100vh;
            padding: clamp(10px, 3vw, 40px);
        }
        #formContainer {
            grid-column: 1 / 3;
            grid-row: 1 / 3;
            width: 90%;
            max-width: 500px;
            margin: 50px auto;
            border: 10px solid rgba(32, 32, 131, 0.907);
            border-radius: 15px;
    
        }
        header{
            grid-column: 1 / 3;
            grid-row: 1 / 2;
            background-image: url('images/jesus_feeds_5000.jpeg');
            background-size: cover;
            background-position: center 1%;
            background-repeat: no-repeat;
            min-height: clamp(150px, 22vw, 200px);
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            border-radius: 5px 5px 0 0;
            position: relative;
            padding-top: 40px;
            box-sizing: border-box;
        }
        h1 {
            margin-top: 20px;
            font-size: clamp(1.6rem, 4vw, 2.5rem);
            text-shadow:
                1px 1px 0 #333,
                2px 2px 0 #333,
                3px 3px 0 #333;
        }
        h2 {
            font-size: clamp(1.2rem, 3vw, 2rem);
            text-shadow:
                1px 1px 0 #333,
                2px 2px 0 #333,
                3px 3px 0 #333;
        }
        #closeBtn {
            display: block;
            position: absolute;
            top: 10px;
            left: 10px;
            margin: 0;
        }
        h3 {
            background-color: white;
            text-align: center;
            padding: clamp(12px, 2vw, 20px);
            font-family: Georgia, Times, 'Times New Roman', serif;
            font-weight: bolder;
            font-size: clamp(1rem, 2.5vw, 1.4rem);
        }
        #myForm {
            min-height: 400px;
            height: auto;
            background-color: white;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            justify-content: center;
            align-items: center;
            gap: 12px 10px;
            padding: 20px 20px 0;
            box-sizing: border-box;
            overflow: hidden;
            border-radius: 0 0 5px 5px;
        }
        label {
            font-weight: bold;
            min-width: 0;
            margin: 0 10px;

        }
        input:not([type="radio"]):not([type="checkbox"]) {
            width: 100%;
            min-width: 0;
            height: 30px;
            box-sizing: border-box;
    
            
        }
        #genderContainer {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 5px;
        }
        #genderContainer label {
            margin: 0;
        }
        section {
            grid-column: 1 / 3;
            text-align: center;
        }
        section button {
            margin: 25px 0;
        }
        #scriptureImages {
            grid-column: 1 / 3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 4px;
            margin-bottom: 0;
            align-self: end;
            margin-left: -20px;
            margin-right: -20px;
            width: calc(100% + 40px);
        
        }
        #scriptureImages img {
            height: clamp(60px, 12vw, 120px);
            object-fit: cover;
            max-width: 18%;
            width: auto;
            margin: 0;
        }
        #openBtn {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 10px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        #openBtn:hover {
            background-color: #333;
            color: white;
        }
    </style>




</head>

<body>
    <div id="formContainer">
        <header>
            <button type="button" id="closeBtn">X</button>
            <h1>Daily Feed</h1>
            <h2>Scripture a Day</h2>
        </header>
        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div id="genderContainer">
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section>
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section>
                <button type="submit">Submit</button>
            </section>
            <div id="scriptureImages">
                <img src="images/old_testament.webp" alt="Old Testament">
                <img src="images/new_testament.webp" alt="New Testament">
                <img src="images/book_of_mormon.webp" alt="Book of Mormon">
                <img src="images/doctrine_and_covenants.webp" alt="Doctrine and Covenants">
                <img src="images/pearl_of_great_price.webp" alt="Pearl of Great Price">
            </div>
        </form>
    </div>
    <button type="button" id="openBtn">Open Form</button>
    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        // document.getElementById("closeBtn").addEventListener("click", function () {
        //     document.getElementById("formContainer").style.display = "none";
        //  });
        // const form = document.getElementById('myForm');
        // const output = document.getElementById('output');

        const formContainer = document.getElementById("formContainer");
        const closeBtn = document.getElementById("closeBtn");
        const openBtn = document.getElementById("openBtn");

        closeBtn.addEventListener("click", function() {
            formContainer.style.display = "none";
            openBtn.style.display = "block";
        });

        openBtn.addEventListener("click", function() {
            formContainer.style.display = "block";
            openBtn.style.display = "none";
        });

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
