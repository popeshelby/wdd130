    <style>
        body {
            display: grid;
            background-color: #e8eced;
            grid-template-columns: 50px 1fr 2fr 1fr 50px;
            grid-template-rows: 30px 180px 20px 1fr 1fr 1fr 30px;
        }
    /* text */
        h1, h2 {
            font-family: Arial;
            color: white;
        }
        h1 {
            grid-column: 2 / -2;
            grid-row: 1 / 2;
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }
        h2 {
            grid-column: 2 / -2;
            grid-row: 3 / 4;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    /* img sizing */
        .profile {
            /* border: 8px solid white; */
            border-radius: 50%;
            height: 90px;
            width: 90px;
            object-fit: cover;
        }
    /* first presidency */
        #oaks {
            height: 110px;
            width: 110px;
            object-fit: cover;
        /* color changing border */
            top: 50%;
            left: 50%;
            transform: translate (-50%, -50%);
            padding: 8px;
            background: linear-gradient(135deg, rgb(233, 48, 7), rgb(6, 33, 213) 50%, white 50%);
            background-size: 250%;
            background-position: 100% 100%;
            transition: background 0.5s;
        }
        #oaks:hover {
            background-position: 0% 0%;
        }
        /*  #oaks:hover {
            border: 8px solid tomato; */
        #eyring, #christofferson {
            margin-top: 20px;
        }
        #eyring {
