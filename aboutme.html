<script nomodule
src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js">
</script>
<script>
// email popup
const emailButton = document.getElementById("open-email-button");
const emailForm = document.getElementById("email-form");
const closeEmail = document.getElementById("close-form-button");
// open email form
emailButton.addEventListener("click", () => {
    emailForm.style.display = "flex";
    requestAnimationFrame(() => {
        emailForm.classList.add("active");
    });
});

// close email form
function closeEmailForm() {
    emailForm.classList.remove("active");
    setTimeout(() => {
        emailForm.style.display = "none";
    }, 350);
}
closeEmail.addEventListener("click", closeEmailForm);
emailForm.addEventListener("click", (event) => {
    if (event.target === emailForm) {
        closeEmailForm();
    }
});
// puppy popup
const puppyButton = document.getElementById("open-puppy-button");
const puppyPopup = document.getElementById("puppy-popup");
const closePuppy = document.getElementById("close-puppy-button");
// open puppy image
puppyButton.addEventListener("click", () => {
    puppyPopup.style.display = "block";
    puppyPopup.classList.add("active");
});
// close puppy image
function closePuppyPopup() {
    puppyPopup.classList.remove("active");
    puppyPopup.style.display = "none";
}
closePuppy.addEventListener("click", closePuppyPopup);

document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
        if (emailForm.classList.contains("active")) {
            closeEmailForm();
        }
        if (puppyPopup.style.display === "block") {
            closePuppyPopup;
        }
    }
});
</script>
